<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Плеер</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%237c3aed'/%3E%3Cg fill='none' stroke='white' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M13 22V9l10-2v13'/%3E%3Ccircle cx='10.5' cy='22' r='2.5'/%3E%3Ccircle cx='20.5' cy='20' r='2.5'/%3E%3C/g%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <script>
    // Тема применяется до отрисовки, чтобы не было мигания
    (function () {
      var theme;
      try { theme = localStorage.getItem('player-theme'); } catch (e) {}
      if (theme !== 'light' && theme !== 'dark') {
        theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      }
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
</head>
<body>
  <div class="app">

    <!-- Категории -->
    <aside class="sidebar panel">
      <div class="sidebar__head">
        <svg class="icon" viewBox="0 0 24 24"><path d="M4 4v16M8 4v16M13 4l6 16"/></svg>
        <h2>Категории</h2>
      </div>
      <nav class="categories" id="categories" aria-label="Категории"></nav>
    </aside>

    <!-- Плейлист -->
    <main class="main panel" id="main">
      <button class="theme-toggle" id="themeToggle" type="button" aria-label="Сменить тему">
        <svg class="icon icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
        <svg class="icon icon-moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>

      <header class="hero">
        <div class="hero__cover" id="heroCover">
          <svg class="icon" viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
        </div>
        <div class="hero__info">
          <span class="hero__label">Плейлист</span>
          <h1 class="hero__title" id="heroTitle">—</h1>
        </div>
      </header>

      <section class="content">
        <div class="actions">
          <button class="btn-play btn-play--lg" id="heroPlay" type="button" aria-label="Воспроизвести"></button>
          <button class="icon-btn toggle-shuffle" id="heroShuffle" type="button" aria-label="Перемешать" aria-pressed="false">
            <svg class="icon" viewBox="0 0 24 24"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>
          </button>
        </div>

        <div class="tracklist">
          <div class="tracklist__head">
            <span class="tracklist__num">#</span>
            <span>Название</span>
            <span class="tracklist__time" aria-label="Длительность">
              <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
            </span>
          </div>
          <ol class="tracks" id="tracks"></ol>
        </div>
      </section>
    </main>

    <!-- Панель управления -->
    <footer class="player">
      <div class="player__now">
        <div class="player__cover" id="playerCover">
          <svg class="icon" viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
        </div>
        <div class="player__meta">
          <div class="player__title" id="playerTitle">Выберите трек</div>
          <div class="player__artist" id="playerArtist">—</div>
        </div>
        <button class="icon-btn like-btn" id="likeBtn" type="button" aria-label="Нравится" aria-pressed="false" disabled>
          <svg class="icon" viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
        </button>
      </div>

      <div class="player__center">
        <div class="controls">
          <button class="icon-btn toggle-shuffle" id="shuffleBtn" type="button" aria-label="Перемешать" aria-pressed="false">
            <svg class="icon" viewBox="0 0 24 24"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>
          </button>
          <button class="icon-btn" id="prevBtn" type="button" aria-label="Предыдущий трек">
            <svg class="icon icon--fill" viewBox="0 0 24 24"><path d="M18 5.5v13a.8.8 0 0 1-1.25.66L7.5 12.66a.8.8 0 0 1 0-1.32l9.25-6.5A.8.8 0 0 1 18 5.5z"/><rect x="5" y="5" width="2.2" height="14" rx="1"/></svg>
          </button>
          <button class="btn-play" id="playBtn" type="button" aria-label="Воспроизвести"></button>
          <button class="icon-btn" id="nextBtn" type="button" aria-label="Следующий трек">
            <svg class="icon icon--fill" viewBox="0 0 24 24"><path d="M6 5.5v13a.8.8 0 0 0 1.25.66l9.25-6.5a.8.8 0 0 0 0-1.32L7.25 4.84A.8.8 0 0 0 6 5.5z"/><rect x="16.8" y="5" width="2.2" height="14" rx="1"/></svg>
          </button>
          <button class="icon-btn" id="repeatBtn" type="button" aria-label="Повтор трека" aria-pressed="false">
            <svg class="icon" viewBox="0 0 24 24"><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></svg>
            <span class="repeat-badge">1</span>
          </button>
        </div>

        <div class="timeline">
          <span class="timeline__time" id="currentTime">0:00</span>
          <div class="progress" id="progress" role="slider" tabindex="0"
               aria-label="Перемотка" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0">
            <div class="progress__track">
              <div class="progress__fill" id="progressFill"></div>
            </div>
          </div>
          <span class="timeline__time" id="duration">0:00</span>
        </div>
      </div>

      <div class="player__volume">
        <button class="icon-btn" id="muteBtn" type="button" aria-label="Выключить звук" aria-pressed="false"></button>
        <input class="volume" id="volume" type="range" min="0" max="100" step="1" value="70" aria-label="Громкость">
      </div>
    </footer>

  </div>

  <script src="script.js"></script>
</body>
</html>
